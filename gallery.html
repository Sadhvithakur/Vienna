<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Gallery - Vienna Bakehouse & Kitchen Café Photos</title>
    <meta name="description"
        content="Explore the ambiance and beauty of Vienna Bakehouse & Kitchen in Koramangala through our photo gallery. European-style café interior and specialty coffee.">
    <meta name="keywords" content="cafe gallery, coffee shop photos, koramangala cafe, bakery interior, cafe ambiance">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="https://viennabakehouse.com/gallery">
    <meta name="theme-color" content="#5c4a42">
    <link rel="icon" type="image/png" href="/media/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <!-- Header injected by shared-layout.js -->

    <!-- ==================== GALLERY SECTION ==================== -->
    <section id="gallery" class="gallery">
        <div class="container">
            <h1 class="section-title">Vienna Café Gallery - Photos from Koramangala's Best Café</h1>
            <p class="section-subtitle">Experience the ambiance and excellence of our café in Koramangala, Bengaluru</p>

            <div class="gallery-grid">
                <div class="gallery-item" data-aos="zoom-in">
                    <img src="/media/1.jpeg" alt="Specialty coffee and book at Vienna cafe Koramangala" loading="lazy">
                    <div class="gallery-overlay"></div>
                </div>
                <div class="gallery-item" data-aos="zoom-in">
                    <img src="/media/2.jpeg" alt="Professional latte art at Vienna bakery and specialty cafe"
                        loading="lazy">
                    <div class="gallery-overlay"></div>
                </div>
                <div class="gallery-item" data-aos="zoom-in">
                    <img src="/media/3.jpeg" alt="Fresh baked pastries and desserts from Vienna bakery" loading="lazy">
                    <div class="gallery-overlay"></div>
                </div>
                <div class="gallery-item" data-aos="zoom-in">
                    <img src="/media/4.png" alt="Coffee brewing setup at Vienna specialty cafe Koramangala"
                        loading="lazy">
                    <div class="gallery-overlay"></div>
                </div>
                <div class="gallery-item" data-aos="zoom-in">
                    <img src="/media/5.jpeg" alt="Rustic wooden interior design at Vienna cafe" loading="lazy">
                    <div class="gallery-overlay"></div>
                </div>
                <div class="gallery-item" data-aos="zoom-in">
                    <img src="/media/6.jpeg" alt="European-style cafe interior at Vienna Kitchen Bakehouse 6th Block"
                        loading="lazy">
                    <div class="gallery-overlay"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer injected by shared-layout.js -->

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Shared Layout System -->
    <script src="/shared-layout.js"></script>

    <!-- Main JavaScript -->
    <script src="/script.js"></script>
    <script src="/mobile-enhancements.js"></script>
    <script src="/media-optimization.js"></script>
</body>

</html>
