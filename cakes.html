<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Custom Cake Orders — Vienna Bakehouse & Kitchen</title>
    <meta name="description"
        content="Order custom handcrafted cakes from Vienna Bakehouse & Kitchen. Personalized designs for birthdays, weddings, events. 5+ days advance notice required.">
    <meta name="keywords" content="custom cakes, personalized cakes, cake orders, Vienna Bakehouse, Koramangala">
    <link rel="icon" type="image/png" href="/media/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/style.css">

    <style>
        /* Custom Cake Order Page Specific Styles */
        :root {
            --brown-deep: #2a1f1a;
            --brown-dark: #3d2e28;
            --brown-mid: #5c4a42;
            --brown-warm: #8b6343;
            --gold: #c9a87c;
            --gold-light: #e8c98c;
            --cream: #fdf8f3;
            --cream-mid: #f5ede3;
            --cream-dark: #ede0d0;
        }

        .cake-order-section {
            background: linear-gradient(135deg, #fdf8f3 0%, #f5ede3 100%);
            padding: 4rem 0;
            min-height: 100vh;
        }

        .cake-hero {
            text-align: center;
            margin-bottom: 3rem;
            margin-top: 2rem;
        }

        .cake-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 400;
            color: var(--brown-deep);
            margin-bottom: 1rem;
        }

        .cake-hero em {
            font-style: italic;
            color: var(--brown-warm);
        }

        .cake-hero p {
            font-size: 1.2rem;
            color: #7a6050;
            margin-bottom: 2rem;
        }

        .hero-pills {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: var(--brown-warm);
            background: rgba(201, 168, 124, 0.12);
            border: 1px solid rgba(201, 168, 124, 0.35);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 500;
        }

        .canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
        }

        .o1 {
            width: 700px;
            height: 700px;
            top: -200px;
            right: -200px;
            background: radial-gradient(circle, rgba(201, 168, 124, 0.13) 0%, transparent 65%);
        }

        .o2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            left: -150px;
            background: radial-gradient(circle, rgba(92, 74, 66, 0.09) 0%, transparent 65%);
        }

        .o3 {
            width: 350px;
            height: 350px;
            top: 50%;
            left: 40%;
            background: radial-gradient(circle, rgba(201, 168, 124, 0.07) 0%, transparent 65%);
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .cake-hero h1 {
                font-size: 2rem;
            }

            .cake-hero p {
                font-size: 1rem;
            }

            .hero-pills {
                gap: 10px;
                flex-direction: column;
                align-items: center;
            }

            .pill {
                font-size: 0.9rem;
                padding: 8px 16px;
            }
        }
    </style>
</head>

<body>
    <!-- Header injected by shared-layout.js -->

    <!-- AMBIENT BACKGROUND -->
    <div class="canvas">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>
    </div>

    <!-- MAIN CAKE ORDER SECTION -->
    <section class="cake-order-section">
        <div class="wrap">

            <!-- HERO -->
            <div class="cake-hero">
                <h1>A cake made<br>just for <em>you.</em></h1>
                <p>Handcrafted with love. Designed to your vision.</p>
                <div class="hero-pills">
                    <span class="pill"><i class="ti ti-clock"></i> Order 5+ days ahead</span>
                    <span class="pill"><i class="ti ti-map-pin"></i> Pickup only · No delivery</span>
                    <span class="pill"><i class="ti ti-heart"></i> Made fresh to order</span>
                </div>
            </div>

            <!-- CAKE ORDER FORM CONTAINER -->
            <div id="cake-order-form-container">
                <!-- Form will be loaded here -->
            </div>

        </div>
    </section>

    <!-- Footer injected by shared-layout.js -->

    <!-- EmailJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Shared Layout System -->
    <script src="/shared-layout.js"></script>

    <!-- Configuration -->
    <script src="/config.js"></script>

    <!-- Cake Order Form Script -->
    <script src="/cake-order-form.js"></script>
    <script src="/mobile-enhancements.js"></script>
    <script src="/media-optimization.js"></script>
</body>

</html>
